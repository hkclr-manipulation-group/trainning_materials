<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>矩阵乘法：行与列怎样生成一个格子</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">矩阵乘法：行与列怎样生成一个格子</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><text x="80" y="150" font-size="27" fill="#172033">A</text><rect x="80" y="180" width="86" height="62" rx="8" fill="#edf1f6" stroke="none"/><text x="112" y="222" font-size="30" fill="#64748b">1</text><rect x="180" y="180" width="86" height="62" rx="8" fill="#edf1f6" stroke="none"/><text x="212" y="222" font-size="30" fill="#64748b">2</text><rect x="80" y="255" width="86" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="112" y="297" font-size="30" fill="#2563eb">3</text><rect x="180" y="255" width="86" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="212" y="297" font-size="30" fill="#2563eb">4</text><text x="390" y="150" font-size="27" fill="#172033">B</text><rect x="390" y="180" width="86" height="62" rx="8" fill="#edf1f6" stroke="none"/><text x="422" y="222" font-size="30" fill="#64748b">2</text><rect x="490" y="180" width="86" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="522" y="222" font-size="30" fill="#2563eb">0</text><rect x="390" y="255" width="86" height="62" rx="8" fill="#edf1f6" stroke="none"/><text x="422" y="297" font-size="30" fill="#64748b">1</text><rect x="490" y="255" width="86" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="522" y="297" font-size="30" fill="#2563eb">2</text><text x="750" y="150" font-size="27" fill="#172033">C = A B</text><rect x="750" y="180" width="86" height="62" rx="8" fill="#edf1f6" stroke="none"/><text x="782" y="222" font-size="30" fill="#64748b">4</text><rect x="850" y="180" width="86" height="62" rx="8" fill="#edf1f6" stroke="none"/><text x="882" y="222" font-size="30" fill="#64748b">4</text><rect x="750" y="255" width="86" height="62" rx="8" fill="#edf1f6" stroke="none"/><text x="782" y="297" font-size="30" fill="#64748b">10</text><rect x="850" y="255" width="86" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="882" y="297" font-size="30" fill="#2563eb">8</text><text x="315" y="251" font-size="32" fill="#172033">×</text><text x="665" y="251" font-size="32" fill="#172033">=</text><text x="90" y="390" font-size="29" fill="#172033">C的第2行、第2列：3×0 + 4×2 = 8</text><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：蓝色A行、B列和C中的对应位置。</text><text x="35" y="557" font-size="20" fill="#172033">观察：3×0 + 4×2 = 8</text><text x="35" y="593" font-size="20" fill="#172033">解释：对应相乘后相加；没有选中的行列不参与这个格子的计算。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：此处普通矩阵乘法；NumPy的逐元素乘法不是同一个操作。</text></svg>