<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>Jacobian：局部直线预测与真实弯曲轨迹</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">Jacobian：局部直线预测与真实弯曲轨迹</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><line x1="175.00" y1="440.00" x2="303.49" y2="331.77" stroke="#2563eb" stroke-width="7" stroke-dasharray=""/><line x1="303.49" y1="331.77" x2="215.76" y2="262.15" stroke="#2563eb" stroke-width="7" stroke-dasharray=""/><circle cx="175.00" cy="440.00" r="7" fill="#64748b"/><circle cx="303.49" cy="331.77" r="7" fill="#2563eb"/><circle cx="215.76" cy="262.15" r="7" fill="#2563eb"/><polyline points="343.00,328.00 339.59,324.13 336.10,320.36 332.52,316.70 328.86,313.15 325.12,309.70 321.30,306.37 317.42,303.14 313.46,300.03 309.44,297.04 305.35,294.16 301.20,291.40 297.00,288.75 292.75,286.23 288.45,283.82 284.10,281.54 279.71,279.38 275.28,277.35 270.82,275.43 266.32,273.64 261.80,271.98 257.25,270.44 252.68,269.02 248.09,267.73 243.49,266.56 238.87,265.51 234.25,264.60 229.63,263.80 225.00,263.13 220.38,262.58 215.76,262.15" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray=""/><line x1="343.00" y1="328.00" x2="242.20" y2="210.40" stroke="#059669" stroke-width="4" stroke-dasharray="8 5"/><circle cx="242.20" cy="210.40" r="8" fill="#059669"/><line x1="215.76" y1="262.15" x2="242.20" y2="210.40" stroke="#dc2626" stroke-width="3" stroke-dasharray="4 4"/><text x="590" y="168" font-size="24" fill="#2563eb">蓝实线/蓝点：真实FK</text><text x="590" y="210" font-size="24" fill="#059669">绿虚线/绿点：固定J的一阶预测</text><text x="590" y="270" font-size="22" fill="#172033">Δq=(0.700, 0.200) rad</text><text x="590" y="315" font-size="24" fill="#dc2626">两者差距=103.77 mm</text><text x="590" y="363" font-size="20" fill="#172033">J始终在初始q=(0°,90°)计算</text><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：红色连接线，就是预测误差。</text><text x="35" y="557" font-size="20" fill="#172033">观察：步长比例=1.00；当前位置误差=103.77 mm。</text><text x="35" y="593" font-size="20" fill="#172033">解释：小步近似准确；把同一个J用于大步，曲率带来的偏差增大。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：这是固定线性化点的对照；数值IK通常每步重新计算J。</text></svg>