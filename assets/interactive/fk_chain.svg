<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>正运动学：沿每节自己的方向走到末端</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">正运动学：沿每节自己的方向走到末端</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><line x1="140.00" y1="440.00" x2="204.95" y2="402.50" stroke="#dc2626" stroke-width="3" stroke-dasharray=""/><line x1="140.00" y1="440.00" x2="102.50" y2="375.05" stroke="#059669" stroke-width="3" stroke-dasharray=""/><text x="209.9519052838329" y="402.5" font-size="18" fill="#dc2626">x</text><text x="107.5" y="375.0480947161671" font-size="18" fill="#059669">y</text><circle cx="140.00" cy="440.00" r="6" fill="#64748b"/><line x1="140.00" y1="440.00" x2="321.87" y2="335.00" stroke="#2563eb" stroke-width="7" stroke-dasharray=""/><circle cx="321.87" cy="335.00" r="6" fill="#2563eb"/><line x1="321.87" y1="335.00" x2="321.87" y2="263.00" stroke="#dc2626" stroke-width="3" stroke-dasharray=""/><line x1="321.87" y1="335.00" x2="249.87" y2="335.00" stroke="#059669" stroke-width="3" stroke-dasharray=""/><text x="326.8653347947321" y="263.0" font-size="18" fill="#dc2626">x</text><text x="254.86533479473212" y="335.0" font-size="18" fill="#059669">y</text><line x1="321.87" y1="335.00" x2="321.87" y2="195.00" stroke="#059669" stroke-width="7" stroke-dasharray=""/><circle cx="321.87" cy="195.00" r="7" fill="#059669"/><text x="560" y="155" font-size="26" fill="#172033">逐节积累变换：</text><text x="560" y="205" font-size="23" fill="#64748b">Rz(30°)：确定第一杆方向</text><text x="560" y="261" font-size="23" fill="#64748b">Tx(.3)：沿局部x走到肘部</text><text x="560" y="317" font-size="23" fill="#64748b">Rz(60°)：第二杆世界角90°</text><text x="560" y="373" font-size="23" fill="#2563eb">Tx(.2)：到达工具尖端</text><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：局部x轴跟着关节转；杆长沿局部x延伸。</text><text x="35" y="557" font-size="20" fill="#172033">观察：Tx(.2)：到达工具尖端</text><text x="35" y="593" font-size="20" fill="#172033">解释：工具点最终为(.2598, .3500) m；姿态角为30°+60°=90°。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：二维两杆教学链；URDF一般还含任意轴、零位与工具固定变换。</text></svg>