<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>换坐标描述：杯子没动，数字为什么会变</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">换坐标描述：杯子没动，数字为什么会变</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><line x1="105.00" y1="425.00" x2="195.00" y2="425.00" stroke="#dc2626" stroke-width="3" stroke-dasharray=""/><line x1="105.00" y1="425.00" x2="105.00" y2="335.00" stroke="#059669" stroke-width="3" stroke-dasharray=""/><text x="200.0" y="425.0" font-size="18" fill="#dc2626">x</text><text x="110.0" y="335.0" font-size="18" fill="#059669">y</text><text x="73" y="452" font-size="19" fill="#172033">A系原点</text><line x1="229.00" y1="363.00" x2="229.00" y2="253.00" stroke="#dc2626" stroke-width="3" stroke-dasharray=""/><line x1="229.00" y1="363.00" x2="119.00" y2="363.00" stroke="#059669" stroke-width="3" stroke-dasharray=""/><text x="234.0" y="253.0" font-size="18" fill="#dc2626">x</text><text x="124.0" y="363.0" font-size="18" fill="#059669">y</text><text x="170" y="388" font-size="19" fill="#172033">B系原点</text><circle cx="353.00" cy="301.00" r="7" fill="#111827"/><text x="323.0" y="276.0" font-size="21" fill="#172033">固定的杯子位置</text><line x1="229.00" y1="363.00" x2="229.00" y2="301.00" stroke="#2563eb" stroke-width="3" stroke-dasharray="5 3"/><line x1="229.00" y1="301.00" x2="353.00" y2="301.00" stroke="#2563eb" stroke-width="3" stroke-dasharray="5 3"/><text x="620" y="170" font-size="27" fill="#172033">只转B坐标轴：90°</text><text x="620" y="224" font-size="23" fill="#172033">p_A 始终 = (0.400, 0.200) m</text><text x="620" y="279" font-size="23" fill="#2563eb">p_B = (0.100, -0.200) m</text><text x="620" y="339" font-size="24" fill="#172033">p_A = R_AB p_B + t_AB</text><text x="620" y="394" font-size="23" fill="#172033">t_AB = (0.200, 0.100) m</text><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：黑点固定；B原点处的红绿轴转动，蓝虚线是分量。</text><text x="35" y="557" font-size="20" fill="#172033">观察：B转到90°，p_B变成(0.100, -0.200) m。</text><text x="35" y="593" font-size="20" fill="#172033">解释：坐标是相对原点和轴的描述；用新坐标回代仍得到同一个p_A。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：二维平面示意；采用右手方向、列向量，未移动被测物体。</text></svg>