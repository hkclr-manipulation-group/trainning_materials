<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>碰撞近似：圆过大误报，过小又可能漏检</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">碰撞近似：圆过大误报，过小又可能漏检</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><circle cx="300" cy="300" r="90.0" fill="#bfdbfe" fill-opacity=".5" stroke="#2563eb" stroke-width="3"/><rect x="220" y="280" width="160" height="40" rx="0" fill="#fef3c7" stroke="#111827"/><circle cx="500" cy="300" r="90.0" fill="#bfdbfe" fill-opacity=".5" stroke="#2563eb" stroke-width="3"/><rect x="420" y="280" width="160" height="40" rx="0" fill="#fef3c7" stroke="#111827"/><line x1="380.00" y1="365.00" x2="420.00" y2="365.00" stroke="#059669" stroke-width="4" stroke-dasharray=""/><text x="350" y="399" font-size="21" fill="#059669">真实间隙4 mm</text><text x="730" y="169" font-size="24" fill="#2563eb">每个圆半径=9 mm</text><text x="730" y="222" font-size="24" fill="#059669">圆间隙=2.0 mm</text><text x="730" y="285" font-size="22" fill="#172033">覆盖角点需至少8.25 mm</text><text x="730" y="335" font-size="24" fill="#059669">角点覆盖：满足</text><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：黄色矩形保持不变，只改蓝色圆半径。</text><text x="35" y="557" font-size="20" fill="#172033">观察：真实两矩形始终相隔4 mm；圆模型间隙=2.0 mm。</text><text x="35" y="593" font-size="20" fill="#172033">解释：9 mm圆仍覆盖这个矩形且不重叠；5 mm圆已不能覆盖零件。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：二维矩形教学例子；未验证真实网格、折叠姿态或机器人自碰撞。</text></svg>