<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>SPI：四类信号各自承担什么任务</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">SPI：四类信号各自承担什么任务</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><rect x="50" y="135" width="220" height="265" rx="8" fill="#e0e7ff" stroke="none"/><rect x="835" y="135" width="215" height="265" rx="8" fill="#dcfce7" stroke="none"/><text x="70" y="169" font-size="26" fill="#172033">主设备</text><text x="852" y="169" font-size="26" fill="#172033">从设备</text><line x1="270.00" y1="210.00" x2="835.00" y2="210.00" stroke="#2563eb" stroke-width="3" stroke-dasharray=""/><text x="390" y="198" font-size="22" fill="#2563eb">SCK →</text><line x1="270.00" y1="262.00" x2="835.00" y2="262.00" stroke="#059669" stroke-width="3" stroke-dasharray=""/><text x="390" y="250" font-size="22" fill="#059669">MOSI →</text><line x1="270.00" y1="314.00" x2="835.00" y2="314.00" stroke="#dc2626" stroke-width="3" stroke-dasharray=""/><text x="390" y="302" font-size="22" fill="#dc2626">MISO ←</text><line x1="270.00" y1="366.00" x2="835.00" y2="366.00" stroke="#64748b" stroke-width="3" stroke-dasharray=""/><text x="390" y="354" font-size="22" fill="#64748b">CS  →</text><text x="77" y="443" font-size="23" fill="#172033">Mode 0，上升沿采样；第4位MOSI=0；CS保持选中</text><circle cx="504.00" cy="262.00" r="7" fill="#059669"/><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：SCK由主设备提供；两个数据方向不同；CS负责选中。</text><text x="35" y="557" font-size="20" fill="#172033">观察：教学字节0xA5按最高位先发；当前第4位=0。</text><text x="35" y="593" font-size="20" fill="#172033">解释：在此Mode 0示例，上升沿采样；位序和CPOL/CPHA需两端约定一致。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：连线示意不模拟边沿时序；实际还需参考地、建立/保持时间和器件电平。</text></svg>