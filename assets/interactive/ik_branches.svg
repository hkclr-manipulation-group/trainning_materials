<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>IK多解：两个正确解取平均，不一定还是解</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">IK多解：两个正确解取平均，不一定还是解</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><text x="40" y="141" font-size="23" fill="#2563eb">解A：正确</text><circle cx="214.00" cy="344.00" r="9" fill="#111827"/><text x="172.0" y="322.0" font-size="18" fill="#172033">固定目标</text><line x1="85.00" y1="430.00" x2="214.00" y2="430.00" stroke="#2563eb" stroke-width="7" stroke-dasharray=""/><line x1="214.00" y1="430.00" x2="214.00" y2="344.00" stroke="#2563eb" stroke-width="7" stroke-dasharray=""/><circle cx="85.00" cy="430.00" r="7" fill="#64748b"/><circle cx="214.00" cy="430.00" r="7" fill="#2563eb"/><circle cx="214.00" cy="344.00" r="7" fill="#2563eb"/><text x="35" y="460" font-size="20" fill="#2563eb">q=(0.0°, 90.0°)</text><text x="390" y="141" font-size="23" fill="#059669">解B：正确</text><circle cx="564.00" cy="344.00" r="9" fill="#111827"/><text x="522.0" y="322.0" font-size="18" fill="#172033">固定目标</text><line x1="435.00" y1="430.00" x2="484.62" y2="310.92" stroke="#059669" stroke-width="7" stroke-dasharray=""/><line x1="484.62" y1="310.92" x2="564.00" y2="344.00" stroke="#059669" stroke-width="7" stroke-dasharray=""/><circle cx="435.00" cy="430.00" r="7" fill="#64748b"/><circle cx="484.62" cy="310.92" r="7" fill="#059669"/><circle cx="564.00" cy="344.00" r="7" fill="#059669"/><text x="385" y="460" font-size="20" fill="#059669">q=(67.4°, -90.0°)</text><text x="740" y="141" font-size="23" fill="#dc2626">平均关节角：错误</text><circle cx="914.00" cy="344.00" r="9" fill="#111827"/><text x="872.0" y="322.0" font-size="18" fill="#172033">固定目标</text><line x1="785.00" y1="430.00" x2="892.33" y2="358.44" stroke="#dc2626" stroke-width="7" stroke-dasharray=""/><line x1="892.33" y1="358.44" x2="963.89" y2="310.74" stroke="#dc2626" stroke-width="7" stroke-dasharray=""/><circle cx="785.00" cy="430.00" r="7" fill="#64748b"/><circle cx="892.33" cy="358.44" r="7" fill="#dc2626"/><circle cx="963.89" cy="310.74" r="7" fill="#dc2626"/><text x="735" y="460" font-size="20" fill="#dc2626">q=(33.7°, 0.0°)</text><line x1="963.89" y1="310.74" x2="914.00" y2="344.00" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：三幅图使用相同杆长和黑色目标。</text><text x="35" y="557" font-size="20" fill="#172033">观察：红臂取关节角平均后伸直，末端偏离约139.4 mm。</text><text x="35" y="593" font-size="20" fill="#172033">解释：FK是非线性映射：FK(平均q)一般不等于平均FK(q)。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：只做二维位置IK，无限位和碰撞；逆解数据不能盲目混合分支做平均。</text></svg>