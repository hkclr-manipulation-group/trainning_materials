<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>协议栈：同一份载荷怎样被封装和拆出</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">协议栈：同一份载荷怎样被封装和拆出</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><text x="60" y="132" font-size="24" fill="#172033">发送端：逐层封装</text><text x="610" y="132" font-size="24" fill="#172033">接收端：逐层取出</text><rect x="60" y="155" width="420" height="60" rx="8" fill="#edf1f6" stroke="none"/><text x="78" y="191" font-size="22" fill="#64748b">应用载荷：8 B</text><rect x="60" y="230" width="420" height="60" rx="8" fill="#edf1f6" stroke="none"/><text x="78" y="266" font-size="22" fill="#64748b">UDP数据报：16 B</text><rect x="60" y="305" width="420" height="60" rx="8" fill="#edf1f6" stroke="none"/><text x="78" y="341" font-size="22" fill="#64748b">IPv4包：36 B</text><rect x="60" y="380" width="420" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="78" y="416" font-size="22" fill="#2563eb">Ethernet捕获记录：50 B</text><rect x="610" y="155" width="420" height="60" rx="8" fill="#edf1f6" stroke="none"/><text x="628" y="191" font-size="22" fill="#64748b">应用载荷：8 B</text><rect x="610" y="230" width="420" height="60" rx="8" fill="#edf1f6" stroke="none"/><text x="628" y="266" font-size="22" fill="#64748b">UDP数据报：16 B</text><rect x="610" y="305" width="420" height="60" rx="8" fill="#edf1f6" stroke="none"/><text x="628" y="341" font-size="22" fill="#64748b">IPv4包：36 B</text><rect x="610" y="380" width="420" height="60" rx="8" fill="#edf1f6" stroke="none"/><text x="628" y="416" font-size="22" fill="#64748b">Ethernet捕获记录：50 B</text><line x1="490.00" y1="413.00" x2="592.00" y2="413.00" stroke="#059669" stroke-width="5" stroke-dasharray=""/><text x="492" y="391" font-size="19" fill="#059669">链路</text><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：Ethernet捕获记录</text><text x="35" y="557" font-size="20" fill="#172033">观察：发送端当前构造：Ethernet捕获记录</text><text x="35" y="593" font-size="20" fill="#172033">解释：再加14字节Ethernet头，捕获示意为50。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：图形不按字节比例；50 B不包含真实线上填充、FCS等全部开销。</text></svg>