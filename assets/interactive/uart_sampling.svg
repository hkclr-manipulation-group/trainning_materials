<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>UART：先看接线，再看接收器在哪采样</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">UART：先看接线，再看接收器在哪采样</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><rect x="60" y="130" width="225" height="80" rx="8" fill="#e0e7ff" stroke="none"/><rect x="795" y="130" width="245" height="80" rx="8" fill="#dcfce7" stroke="none"/><text x="80" y="162" font-size="24" fill="#172033">MCU A：TX</text><text x="815" y="162" font-size="24" fill="#172033">MCU B：RX</text><line x1="285.00" y1="165.00" x2="795.00" y2="165.00" stroke="#2563eb" stroke-width="4" stroke-dasharray=""/><text x="418" y="151" font-size="20" fill="#2563eb">兼容的逻辑电平</text><text x="81" y="199" font-size="19" fill="#172033">参考 GND</text><text x="816" y="199" font-size="19" fill="#172033">参考 GND</text><line x1="285.00" y1="199.00" x2="795.00" y2="199.00" stroke="#64748b" stroke-width="2" stroke-dasharray=""/><polyline points="75.00,365.00 168.00,365.00 168.00,275.00 261.00,275.00 261.00,365.00 354.00,365.00 354.00,275.00 447.00,275.00 447.00,365.00 540.00,365.00 540.00,365.00 633.00,365.00 633.00,275.00 726.00,275.00 726.00,365.00 819.00,365.00 819.00,275.00 912.00,275.00 912.00,275.00 1005.00,275.00" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray=""/><line x1="586.50" y1="245.00" x2="586.50" y2="390.00" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 3"/><circle cx="586.50" cy="365.00" r="6" fill="#dc2626"/><text x="81" y="425" font-size="19" fill="#64748b">起始</text><text x="174" y="425" font-size="19" fill="#64748b">d0</text><text x="267" y="425" font-size="19" fill="#64748b">d1</text><text x="360" y="425" font-size="19" fill="#64748b">d2</text><text x="453" y="425" font-size="19" fill="#64748b">d3</text><text x="546" y="425" font-size="19" fill="#dc2626">d4</text><text x="639" y="425" font-size="19" fill="#64748b">d5</text><text x="732" y="425" font-size="19" fill="#64748b">d6</text><text x="825" y="425" font-size="19" fill="#64748b">d7</text><text x="918" y="425" font-size="19" fill="#64748b">停止</text><text x="90" y="462" font-size="21" fill="#172033">115200 bit/s：每位约8.68微秒；红线为本位中间采样示意</text><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：TX连RX；红色采样位置沿电平波形前进。</text><text x="35" y="557" font-size="20" fill="#172033">观察：当前d4，逻辑值=0；数据0xA5，最低位先发。</text><text x="35" y="593" font-size="20" fill="#172033">解释：8N1一字节占起始1位、数据8位、停止1位，共10个位时间。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：逻辑波形，不是RS-232实际电压；不模拟波特率误差与电气边沿。</text></svg>