<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><title>CAN差分：两根线都变化，差值可以不变</title><rect width="1100" height="680" fill="#f8fafc"/><text x="28" y="48" font-size="30" fill="#172033">CAN差分：两根线都变化，差值可以不变</text><text x="28" y="88" font-size="20" fill="#64748b">先预测，再单步；颜色之外还有文字、数值和线型。</text><rect x="50" y="155" width="210" height="140" rx="8" fill="#e0e7ff" stroke="none"/><rect x="840" y="155" width="210" height="140" rx="8" fill="#dcfce7" stroke="none"/><text x="67" y="189" font-size="25" fill="#172033">收发器A</text><text x="856" y="189" font-size="25" fill="#172033">收发器B</text><line x1="260.00" y1="225.00" x2="840.00" y2="225.00" stroke="#dc2626" stroke-width="4" stroke-dasharray=""/><line x1="260.00" y1="270.00" x2="840.00" y2="270.00" stroke="#2563eb" stroke-width="4" stroke-dasharray=""/><text x="380" y="216" font-size="22" fill="#dc2626">CAN_H</text><text x="380" y="301" font-size="22" fill="#2563eb">CAN_L</text><line x1="290.00" y1="225.00" x2="290.00" y2="270.00" stroke="#64748b" stroke-width="3" stroke-dasharray=""/><rect x="281" y="235" width="18" height="24" rx="8" fill="white" stroke="#64748b"/><text x="260" y="330" font-size="18" fill="#172033">120 Ω</text><line x1="810.00" y1="225.00" x2="810.00" y2="270.00" stroke="#64748b" stroke-width="3" stroke-dasharray=""/><rect x="801" y="235" width="18" height="24" rx="8" fill="white" stroke="#64748b"/><text x="780" y="330" font-size="18" fill="#172033">120 Ω</text><text x="65" y="380" font-size="26" fill="#172033">H=3.9 V；L=1.9 V；差值=2.0 V</text><text x="65" y="426" font-size="26" fill="#172033">共同扰动=+0.4 V；当前显性0</text><rect x="20" y="491" width="1060" height="171" rx="8" fill="#e8eef7" stroke="none"/><text x="35" y="521" font-size="20" fill="#172033">看哪里：双线、两端终端以及下面的H−L数值。</text><text x="35" y="557" font-size="20" fill="#172033">观察：本步差分=2.0 V；理想共同扰动在相减中抵消。</text><text x="35" y="593" font-size="20" fill="#172033">解释：CAN控制器先经过收发器再接总线；终端位于设计的总线两端。</text><text x="35" y="629" font-size="19" fill="#64748b">边界：典型电压教学示意；仍受器件共模范围限制，未给出实际接头针脚。</text></svg>